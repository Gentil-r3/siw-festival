spring.application.name=festival
spring.datasource.url=jdbc:postgresql://localhost:5433/siwfestival
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
#dice a Hibernate di contare le query questa riga sotto
spring.jpa.properties.hibernate.generate_statistics=true
#==================================
# = Messages configuration
#==================================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
#==================================
# = Logging configuration
#==================================
logging.level.root=INFO
logging.level.it.uniroma3.siw.festival.service=DEBUG
