<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base.html :: headerfiles(title='SiwFestival - Registrazione')}"></head>

<body>
	<header th:replace="~{fragments/base.html :: intestazione}"></header>
	<main>
		<h1>Registrazione nuovo utente</h1>
		<form th:action="@{/register}" method="POST">
			<div>
				<label>Nome</label>
				<span><input type="text" required th:field="${user.name}" /></span>
				<span class="error" th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}"></span>
			</div>
			<div>
				<label>Cognome</label>
				<span><input type="text" required th:field="${user.surname}" /></span>
				<span class="error" th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}"></span>
			</div>
			<div>
				<label>Email</label>
				<span><input type="email" required th:field="${user.email}" /></span>
				<span class="error" th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}"></span>
			</div>
			<div>
				<label>Username</label>
				<span><input type="text" required th:field="${credentials.username}" /></span>
				<span class="error" th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"></span>
			</div>
			<div>
				<label>Password</label>
				<span><input type="password" required th:field="${credentials.password}" /></span>
				<span class="error" th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"></span>
			</div>
			<div>
				<button type="submit">Registrati</button>
			</div>
		</form>
	</main>
	<footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
